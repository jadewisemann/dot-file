[layout]
gap = 20
outer_gap_left = 20
outer_gap_right = 20
outer_gap_top = 20
outer_gap_bottom = 20
centering_mode = "center"
center_past_edges = true
width_presets = [
    0.5,
    0.667,
    1.0,
]
default_width_preset = 1
height_presets = [
    0.5,
    1.0,
]

[appearance]
active_border = true
active_border_color = "00D9FF"
active_border_width = 5
active_border_position = "outside"
tab_strip_height = 28
tab_strip_bg = "1F1F1F"
tab_strip_active_bg = "303030"
tab_strip_active_text = "FFFFFF"
tab_strip_inactive_text = "A0A0A0"
tab_strip_opacity = 230

[behavior]
focus_new_windows = true
track_focus_changes = true
log_level = "info"
focus_follows_mouse = false
focus_follows_mouse_delay_ms = 100
disable_snap_layouts = true
check_for_updates = true
tab_close_action = "close_window"
swap_chain_ghost_animation = false
new_window_placement = "new_column"
hide_offscreen_taskbar_buttons = true
workspace_edge_wrap = false
mouse_follows_focus = false
fullscreen_follows_focus = true

[hotkeys]
scroll_modifier = "Ctrl+Alt"
disabled = []
"Alt         + Ctrl + J" = "cycle_width_down"
"Alt                + O" = "toggle_tabbed"
"Alt + Shift        + J" = "move_window_left"
"Ctrl+Alt+Shift+R" = "reload"
"Ctrl+Alt+Home" = "focus_start"
"Alt + Shift        + M" = "move_to_workspace_next"
"Alt                + /" = "toggle_sticky"
"Alt         + Ctrl + /" = "move_to_monitor_down"
"Alt + Shift        + N" = "expel_to_left"
"Ctrl+Alt+2" = "switch_workspace_2"
"Ctrl+Alt+8" = "switch_workspace_8"
"Ctrl+Alt+0" = "equalize_widths"
"Alt                + N" = "move_column_left"
"Alt         + Ctrl + L" = "cycle_height_up"
"Ctrl+Alt+3" = "switch_workspace_3"
"Alt                + B" = "center_column"
"Alt         + Ctrl + U" = "move_to_monitor_left"
"Alt                + L" = "focus_up"
"Ctrl+Alt+1" = "switch_workspace_1"
"Ctrl+Alt+P" = "toggle_pause"
"Ctrl+Alt+Shift+9" = "move_to_workspace_9"
"Alt         + Ctrl + P" = "cycle_width_up"
"Alt         + Ctrl + ." = "consume_from_right"
"Alt                + K" = "focus_down"
"Alt                + ," = "workspace_prev"
"Ctrl+Alt+6" = "switch_workspace_6"
"Ctrl+Alt+Shift+6" = "move_to_workspace_6"
"Alt                + P" = "focus_right"
"Alt         + Ctrl + K" = "cycle_height_down"
"Ctrl+Alt+W" = "close_window"
"Ctrl+Q" = "close_window"
"Ctrl+Alt+Shift+1" = "move_to_workspace_1"
"Alt                + I" = "toggle_fullscreen"
"Alt + Shift        + ," = "move_to_workspace_prev"
"Alt                + H" = "toggle_overview"
"Ctrl+Alt+Shift+2" = "move_to_workspace_2"
"Alt         + Ctrl + N" = "consume_from_left"
"Alt                + M" = "workspace_next"
"Ctrl+Alt+5" = "switch_workspace_5"
"Ctrl+Alt+R" = "refresh"
"Alt                + J" = "focus_left"
"Alt + Shift        + I" = "focus_monitor_right"
"Ctrl+Alt+7" = "switch_workspace_7"
"Ctrl+Alt+9" = "switch_workspace_9"
"Alt + Shift        + K" = "move_window_down"
"Alt                + Y" = "scratchpad_toggle"
"Alt + Shift        + /" = "focus_monitor_down"
"Ctrl+Alt+Shift+0" = "equalize_heights"
"Alt + Shift        + U" = "focus_monitor_left"
"Ctrl+Alt+Shift+End" = "move_column_to_end"
"Alt         + Ctrl + O" = "move_to_monitor_up"
"Win+Ctrl+Escape" = "panic_revert"
"Alt + Shift        + ." = "expel_to_right"
"Alt                + U" = "toggle_floating"
"Ctrl+Alt+End" = "focus_end"
"Ctrl+Alt+Shift+5" = "move_to_workspace_5"
"Ctrl+Alt+Shift+4" = "move_to_workspace_4"
"Alt + Shift        + Y" = "scratchpad_stash"
"Alt + Shift        + O" = "focus_monitor_up"
"Ctrl+Alt+Shift+Home" = "move_column_to_start"
"Ctrl+Alt+Shift+3" = "move_to_workspace_3"
"Alt + Shift        + B" = "maximize_column"
"Ctrl+Alt+Shift+7" = "move_to_workspace_7"
"Alt         + Ctrl + I" = "move_to_monitor_right"
"Alt + Shift        + P" = "move_window_right"
"Ctrl+Alt+4" = "switch_workspace_4"
"Ctrl+Alt+Shift+8" = "move_to_workspace_8"
"Alt + Shift        + L" = "move_window_up"
"Alt                + ." = "move_column_right"

[[window_rules]]
match_class = "MozillaDialogClass"
action = "tile"
corner_style = "square"
open_maximized = false
sticky = false

[gestures]
enabled = false
swipe_left = "focus_left"
swipe_right = "focus_right"
swipe_up = "focus_up"
swipe_down = "focus_down"
scroll_up = "focus_next"
scroll_down = "focus_prev"

[snap_hints]
enabled = true
duration_ms = 200
opacity = 128

[animation]
layout_duration_ms = 50
workspace_switch_duration_ms = 100
scroll_duration_ms = 75
overview_duration_ms = 100
easing = "ease_out"
reduce_motion_on_battery = true

[workspaces]
names = []

[overview]
render = "live"
