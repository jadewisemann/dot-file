general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  use_virtual_desktops: true
  cursor_jump:
    enabled: false
    trigger: 'window_focus' # 'monitor_focus', 'window_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '10px'
  outer_gap:
    top: '10px'
    right: '10px'
    bottom: '10px'
    left: '10px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#b37c75'

    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      # Allowed values: 'square', 'rounded', 'small_rounded'.
      style: 'square'

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      color: '#a1a1a1'
    hide_title_bar:
    corner_style:
      enabled: false
      style: 'square'

window_behavior:
  initial_state: 'tiling'
  
  state_defaults:
    floating:
      centered: true
      shown_on_top: true

    fullscreen:
      maximized: true
      shown_on_top: false
workspaces:
  - name: '1'
    bind_to_monitor: 1
  - name: '2'
    bind_to_monitor: 1
  - name: '3'
    bind_to_monitor: 1
  - name: '4'
    bind_to_monitor: 1
  - name: '5'
    bind_to_monitor: 1
  - name: '6'
    bind_to_monitor: 1
  - name: '7'
    bind_to_monitor: 1
  - name: '8'
    bind_to_monitor: 1
  - name: '9'
    bind_to_monitor: 1
  - name: '0'
    bind_to_monitor: 0
    
window_rules:
  - commands: ['ignore']
    match:
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper'}
      - window_process: { equals: 'Webex' }
        window_class: { regex: 'Webex'}
      - window_process: { equals: 'WindowsTerminal' }
        window_title: { equals: 'quake_terminal' }
binding_modes:
  - name: 'focus-desktop'
    keybindings:
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 1']
        bindings: ['x']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 2']
        bindings: ['c']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 3']
        bindings: ['v']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 4']
        bindings: ['s']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 5']
        bindings: ['d']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 6']
        bindings: ['f']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 7']
        bindings: ['w']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 8']
        bindings: ['e']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 9']
        bindings: ['r']
      - commands: ['wm-disable-binding-mode --name focus-desktop', 'focus --workspace 0']
        bindings: ['a']

      - commands: ['wm-disable-binding-mode --name focus-desktop']
        bindings: ['esc', 'enter', 'alt+m']


  - name: 'move-desktop'
    keybindings:
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 1', 'focus --workspace 1']
        bindings: ['x']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 2', 'focus --workspace 2']
        bindings: ['c']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 3', 'focus --workspace 3']
        bindings: ['v']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 4', 'focus --workspace 4']
        bindings: ['s']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 5', 'focus --workspace 5']
        bindings: ['d']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 6', 'focus --workspace 6']
        bindings: ['f']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 7', 'focus --workspace 7']
        bindings: ['w']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 8', 'focus --workspace 8']
        bindings: ['e']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 9', 'focus --workspace 9']
        bindings: ['r']
      - commands: ['wm-disable-binding-mode --name move-desktop', 'move --workspace 0', 'focus --workspace 0']
        bindings: ['a']

      - commands: ['wm-disable-binding-mode --name move-desktop']
        bindings: ['esc', 'enter', 'alt+m', 'alt+shift+m']

keybindings:
  # Shift Focus
  - commands: ['focus --direction left']
    bindings: ['alt+j']
  - commands: ['focus --direction right']
    bindings: ['alt+p']
  - commands: ['focus --direction up']
    bindings: ['alt+l']
  - commands: ['focus --direction down']
    bindings: ['alt+k']

  # Move Window
  - commands: ['move --direction left']
    bindings: ['alt+shift+j']
  - commands: ['move --direction right']
    bindings: ['alt+shift+p']
  - commands: ['move --direction up']
    bindings: ['alt+shift+l']
  - commands: ['move --direction down']
    bindings: ['alt+shift+k']

  # Toggle Full | Minimize
  - commands: ['toggle-fullscreen']  
    bindings: ['alt+i']
  - commands: ['toggle-minimized']
    bindings: ['alt+y']

  - commands: ['toggle-tiling-direction']
    bindings: ['alt+o']
  
  - commands: ['toggle-floating']
    bindings: ['alt+u']

  - commands: ['toggle-tiling']
    bindings: ['alt+h']


  - commands: ['set-tiling']
    bindings: ['alt+shift+h']

  - commands: ['set-floating']
    bindings: ['alt+shift+u']



  # Desktop
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+n']
  - commands: ['wm-enable-binding-mode --name focus-desktop']
    bindings: ['alt+m']
  - commands: ['focus --next-active-workspace'] 
    bindings: ['alt+,']

  - commands: ['move --prev-workspace', 'focus --prev-active-workspace']
    bindings: ['alt+shift+n']
  - commands: ['wm-enable-binding-mode --name move-desktop']
    bindings: ['alt+shift+m']
  - commands: ['move --next-workspace', 'focus --next-active-workspace']
    bindings: ['alt+shift+,']



  # Misc
  - commands: ['close']
    bindings: ['lctrl+q']
  
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']

  # execute a shell
  - commands: ['shell-exec wt']
    bindings: ['alt+shift+t']