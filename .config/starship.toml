## Shell / System

[hg_branch]
symbol = " "
style = "bold #9854f1"

[memory_usage]
symbol = "󰍛 "
style = "bold #565a6e"

[nix_shell]
symbol = " "
style = "bold #007197"

[shlvl]
symbol = " "
style = "bold #565a6e"

## Disabled / Optional Modules

[os]
disabled = true
format = "[$symbol$name]($style) "
style = "bold #565a6e"

[os.symbols]
Windows = " "
Ubuntu = " "
Linux = " "
Macos = " "
Arch = " "
Debian = " "
Fedora = " "
NixOS = " "
Unknown = " "